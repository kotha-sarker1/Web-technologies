<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Global Tech Connect Event Registration</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>


<body>

    <div class="container">
        <h2>Global Tech Connect Registration</h2>
        
        <form id="registrationForm" onsubmit="return collectData()">
            <div class="form-group">
                <label>Full Name (Required):</label>
                <input type="text" id="fullName" placeholder="Enter your full name">
                <p id="nameErr" class="error"></p>
            </div>

            <div class="form-group">
                <label>Professional Email (Required):</label>
                <input type="email" id="email" placeholder="email@example.com">
                <p id="emailErr" class="error"></p>
            </div>

            <div class="form-group">
                <label>Company/Institution (Optional):</label>
                <input type="text" id="company" maxlength="100">
            </div>

            <div class="form-group">
                <label>Attendance Type (Required):</label><br>
                <input type="radio" name="attendance" value="Virtual"> Virtual
                <input type="radio" name="attendance" value="In-Person"> In-Person
                <p id="typeErr" class="error"></p>
            </div>

            <button type="submit" id="submitBtn">Register Now</button>
        </form>

        <hr>

        <button id="toggleBtn" onclick="toggleAnalytics()">Show Event Analytics</button>
        
        <div id="analyticsPanel" style="display: none;">
            <h3>Event Insights</h3>
            <p>Total Registrants: <span id="totalCount">0</span></p>
            <p>Virtual Attendees: <span id="virtualCount">0</span></p>
            <p>In Person Attendees: <span id="inPersonCount">0</span></p>
        </div>
    </div>

</body>
</html>
